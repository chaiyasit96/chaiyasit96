<svg xmlns="http://www.w3.org/2000/svg" width="660" height="195" viewBox="0 0 660 195" role="img" aria-label="GitHub Contribution Streak">
  <title>GitHub Contribution Streak</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #79C0FF; }
    .label { font-size: 14px; fill: #C9D1D9; }
    .value { font-size: 14px; font-weight: 700; fill: #C9D1D9; }
    .muted { font-size: 12px; fill: #8B949E; }
    .fade { opacity: 0; animation: fade 0.6s ease-in-out forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="659" height="194" fill="#0D1117" stroke="#30363D"/>
  <line x1="223" y1="28" x2="223" y2="170" stroke="#30363D"/>
  <line x1="437" y1="28" x2="437" y2="170" stroke="#30363D"/>
  <g class="fade" style="animation-delay:150ms" transform="translate(116, 0)" text-anchor="middle">

    <text x="0" y="80" style="font-size:28px;font-weight:700;fill:#C9D1D9">181</text>
    <text x="0" y="115" style="font-size:14px;font-weight:600;fill:#C9D1D9">Total Contributions</text>
    <text x="0" y="140" class="muted">Jan 1, 2020 - Present</text>
  </g>
  <g class="fade" style="animation-delay:300ms" transform="translate(330, 0)" text-anchor="middle">
    <circle cx="0" cy="83" r="40" fill="none" stroke="#79C0FF" stroke-width="5"/>
    <g transform="translate(-8, 22)"><path fill="#BC8CFF" stroke="#0D1117" stroke-width="2" d="M8 0c1 5 6 7 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9Z"/></g>
    <text x="0" y="92" style="font-size:28px;font-weight:700;fill:#C9D1D9">2</text>
    <text x="0" y="150" style="font-size:14px;font-weight:600;fill:#79C0FF">Current Streak</text>
    <text x="0" y="172" class="muted">Nov 6 - Nov 7</text>
  </g>
  <g class="fade" style="animation-delay:450ms" transform="translate(544, 0)" text-anchor="middle">

    <text x="0" y="80" style="font-size:28px;font-weight:700;fill:#C9D1D9">11</text>
    <text x="0" y="115" style="font-size:14px;font-weight:600;fill:#C9D1D9">Longest Streak</text>
    <text x="0" y="140" class="muted">Jun 8 - Jun 18</text>
  </g>
</svg>
